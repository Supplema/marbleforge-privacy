<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marble Forge — a rival has challenged you</title>
<meta name="theme-color" content="#120d0a">
<meta property="og:title" content="A rival has challenged you">
<meta property="og:description" content="Tap to open the duel in Marble Forge.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#120d0a;color:#f3e6d2;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
    background-image:radial-gradient(120% 80% at 50% 0%,#2a1a10 0%,#120d0a 60%);
  }
  .wrap{width:100%;max-width:420px}
  .kicker{
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:#c8873f;margin-bottom:14px
  }
  h1{
    font-size:30px;line-height:1.15;letter-spacing:.01em;margin-bottom:10px;
    color:#ffd699;text-shadow:0 2px 18px rgba(255,150,40,.28)
  }
  .sub{color:#b6a894;font-size:16px;margin-bottom:28px}
  .cta{
    display:block;width:100%;padding:20px 18px;margin-bottom:12px;
    border:0;border-radius:14px;cursor:pointer;
    font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    text-decoration:none;color:#1a1109;
    background:linear-gradient(180deg,#ffc061 0%,#e8912c 100%);
    box-shadow:0 6px 22px rgba(232,145,44,.32)
  }
  .cta:active{transform:translateY(1px)}
  .ghost{
    display:block;width:100%;padding:15px 18px;margin-bottom:12px;
    border:1px solid #3d2c1e;border-radius:12px;background:transparent;
    color:#d9c6ab;font-size:15px;text-decoration:none;cursor:pointer
  }
  .idbox{
    margin:22px 0 10px;padding:14px;border-radius:12px;
    background:#1b120c;border:1px solid #33241a
  }
  .idlabel{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8d7a66}
  .idval{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:17px;color:#ffd699;word-break:break-all;margin-top:6px
  }
  .foot{margin-top:22px;font-size:13px;color:#7d6d5c;line-height:1.6}
  .foot a{color:#c8873f}
  .hint{font-size:13px;color:#8d7a66;margin-top:16px;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Marble Forge</div>
  <h1>A rival has challenged you</h1>
  <p class="sub">Open the duel and take your turn.</p>

  <a class="cta" id="open" href="#">Open in Marble Forge</a>
  <a class="ghost" id="store" href="https://play.google.com/store/apps/details?id=com.forgeplay.marbleforge">I don't have the game yet</a>

  <div class="hint" id="hint"></div>

  <div class="idbox">
    <div class="idlabel">Duel id</div>
    <div class="idval" id="idval">—</div>
  </div>
  <button class="ghost" id="copy" type="button">Copy duel id</button>

  <p class="foot">
    Nothing personal is stored — the duel id is the only key.<br>
    <a href="./privacy_policy.html">Privacy</a>
  </p>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var id = (params.get('d') || params.get('c') || '').trim();
  // Only ever hand onward what the game itself would accept.
  if (!/^[a-z0-9]{12,32}$/.test(id)) { id = ''; }

  var deep = id ? ('marbleforge://duel?d=' + encodeURIComponent(id)) : '';
  var openBtn = document.getElementById('open');
  var hint = document.getElementById('hint');
  var idval = document.getElementById('idval');
  var copyBtn = document.getElementById('copy');

  if (!id) {
    document.querySelector('h1').textContent = 'This invite link is incomplete';
    document.querySelector('.sub').textContent =
      'Ask your rival to send the invite again from the game.';
    openBtn.style.display = 'none';
    copyBtn.style.display = 'none';
    return;
  }

  idval.textContent = id;
  openBtn.href = deep;

  copyBtn.addEventListener('click', function () {
    navigator.clipboard.writeText(id).then(function () {
      copyBtn.textContent = 'Copied';
    }, function () {
      copyBtn.textContent = 'Select the id above to copy';
    });
  });

  // Try to hand off immediately. If the app is installed the page is
  // replaced by the game; if not, nothing visible happens and the
  // button is still sitting there, so a failed attempt costs nothing.
  var tried = false;
  function handoff() {
    if (tried) { return; }
    tried = true;
    hint.textContent = 'Opening Marble Forge…';
    window.location.href = deep;
    setTimeout(function () {
      hint.textContent = 'Still here? Tap the button above.';
    }, 2200);
  }
  // Phones only. On desktop there is no app to open and the unknown
  // scheme just stalls the browser, so the button carries it there.
  if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    setTimeout(handoff, 250);
  } else {
    hint.textContent = 'Open this link on the phone that has Marble Forge.';
  }
  openBtn.addEventListener('click', function () { tried = false; });
})();
</script>
</body>
</html>
